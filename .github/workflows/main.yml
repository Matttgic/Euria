name: Football Bot Daily

on:
  schedule:
    - cron: '0 8 * * *' # Chaque jour à 8h00 UTC
  workflow_dispatch: # Lancement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache des API (dernière valeur connue en cas de panne). Conservé entre les exécutions
      # par GitHub, jamais commité : il contient des cotes brutes (conditions Parlay).
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: euria-api-cache-${{ github.run_id }}
          restore-keys: euria-api-cache-

      - name: Run bot
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_KEY_FOOTBALL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          for f in data/suivi_paris.csv data/predictions.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || (git commit -m "MAJ automatique suivi et prédictions" && git push)
